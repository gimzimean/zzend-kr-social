name: engage
# 09:00~23:00 KST 2시간마다 우리 게시물의 새 댓글·스레드 답글에 짧게 답한다.
on:
  schedule:
    - cron: '0 0-14/2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: post
jobs:
  engage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 답글
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: node scripts/engage.mjs
      - name: 답한 기록·새 토큰 저장
        if: always()
        run: |
          git config user.name "zzend-bot"
          git config user.email "actions@users.noreply.github.com"
          git add engaged.json tokens.enc 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "답글 기록 갱신" && git pull --rebase && git push)
